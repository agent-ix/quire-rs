[package]
name = "quire-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
tempfile = "^3"
time = { version = "^0.3", features = ["formatting"] }
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
