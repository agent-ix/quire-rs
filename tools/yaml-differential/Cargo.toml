[package]
name = "quire-yaml-differential"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
old_yaml = { package = "serde_yaml", version = "=0.9.34" }
new_yaml = { package = "yaml_serde", version = "=0.10.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Keep the retired engine entirely outside quire-rs's production, dev, fuzz,
# and locked dependency graphs. This package exists only to reproduce the
# ADR-0012 migration differential.
[workspace]
members = []
