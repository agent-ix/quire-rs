[package]
name = "spec-objects-safety-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Resolves the published @agent-ix/spec-objects-safety npm package at build time for authentic record-section schemas; no schema bytes are committed here."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-rs"
publish = false
build = "build.rs"

[lib]
name = "spec_objects_safety_fixture"
path = "src/lib.rs"

[build-dependencies]
build-npm-fetch = { path = "../build-npm-fetch" }

[lints.rust]
unsafe_code = "forbid"
