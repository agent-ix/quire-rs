[package]
name = "quire-fixtures"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Shared Quire mapping fixtures and fetched authentic module schemas for downstream integration tests."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-rs"
publish = false

[lib]
name = "quire_fixtures"
path = "src/lib.rs"

[dependencies]
serde_json = "^1"
spec-objects-safety-fixture = { path = "../spec-objects-safety-fixture" }

[lints.rust]
unsafe_code = "forbid"
