[package]
name = "quire-code-extraction"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
# This crate wraps all four `quire-code-parse` grammars (rust/python/typescript/bash)
# behind per-grammar features (PLAT-851); it was renamed from
# `quire-rust-extraction` by PLAT-876.
description = "Dependency-boundary crate: the only place in the quire-rs workspace that names quire-code-parse/tree-sitter (PLAT-843, widened PLAT-851), enforced by scripts/audits/check_tree_sitter_boundary.sh (PLAT-911)."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-rs"
publish = false

[lib]
name = "quire_code_extraction"
path = "src/lib.rs"

# Purity boundary, copied from filament-ide-rs's `crates/filament-code-extraction`
# (FR-072-AC-5 there): this crate names exactly one dependency, so it is the
# only place in this workspace `cargo tree` shows a tree-sitter dependency
# outside the `quire-code-parse` pin. `src/symbols/{rust,python,typescript}.rs`
# (`quire-rs`, the root package) reach tree-sitter's `Node`/`TreeCursor`
# solely through this crate's re-export — see `src/lib.rs` — and never name
# `tree-sitter` or `quire-code-parse` itself. Enforced, not just asserted:
# `scripts/audits/check_tree_sitter_boundary.sh` (run by `make audit-static`,
# PLAT-911) fails, naming file and line, if any other Cargo.toml in this
# workspace names `quire-code-parse` or `tree-sitter`/`tree-sitter-<lang>`.
#
# Pinned by git rev, per org convention for unpublished crates:
# crates.io publishing is deferred, so the pin stays git-rev rather than a
# registry version. `quire-code-parse` is a shared, borrowed tree-sitter parse
# layer with no fact model, type environment, fixpoint call resolver or record
# emitter attached — exactly the subset `quire-rs` needs and none of what it
# doesn't.
#
# `default-features = false` and no `features` listed here: which grammar(s)
# actually compile is decided by *this* crate's own `[features]` below, one
# per grammar, each forwarding to the matching `quire-code-parse` feature.
# Pulling `features = ["rust", "python", "typescript"]` unconditionally here
# would mean any one of `quire-rs`'s `rust-symbols`/`python-symbols`/
# `typescript-symbols` features transitively compiled all three tree-sitter C
# grammars — defeating the reason `rust-symbols` is excluded from the `wasm`
# build today (`tree-sitter-rust`'s `cc`-crate build script cannot
# cross-compile to `wasm32-unknown-unknown` in this toolchain) and directly
# contradicting FR-013-CON-3's own stated principle: a consumer that wants one
# grammar must not link the other two.
[dependencies]
quire-code-parse = { git = "https://github.com/agent-ix/quire-code-rs", rev = "108ddda6bdeab1dd97e5c638d41b6df8167b1fa1", default-features = false }

[dev-dependencies]
serde_json = "^1"

# One feature per grammar, mirroring `quire-code-parse`'s own three
# (default = none: this crate's own default-features stay off so a consumer
# always chooses explicitly, the same discipline `quire-code-parse` documents
# for itself). `quire-rs`'s `rust-symbols`/`python-symbols`/`typescript-symbols`
# features (root `Cargo.toml`) each activate exactly one of these.
[features]
rust = ["quire-code-parse/rust"]
python = ["quire-code-parse/python"]
typescript = ["quire-code-parse/typescript"]
bash = ["quire-code-parse/bash"]

[lints.rust]
unsafe_code = "forbid"
