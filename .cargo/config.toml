# pyo3 `extension-module` (feature = "python") produces a cdylib with
# undefined `_Py*` symbols that resolve against the host interpreter at
# load time. maturin injects these link args when building the wheel;
# these entries let plain `cargo build/clippy/test --features python`
# link too (FR-023-AC-1). Harmless for the default (no-python) build —
# the cdylib has no undefined symbols then, so the flag is a no-op.

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# clippy.toml bans (disallowed-types/methods) are opt-in: allowed everywhere
# (build tools and the corpus submodule legitimately spawn processes), and
# re-enabled by `#![deny(...)]` in the quire-rs library modules they police.
# Source attributes override these flags, and bare `cargo clippy` in CI picks
# them up without a workflow edit.
[target.'cfg(all())']
rustflags = ["-A", "clippy::disallowed-types", "-A", "clippy::disallowed-methods"]
