manifest_version: 1.0.0
name: spec-objects-architecture
version: 0.4.0
description: >-
  Minimal test fixture (PLAT-906): the systems-model kinds (part, port,
  connection, allocation, interface) that tests/semantic_systems.rs and
  tests/semantic_features.rs exercise, trimmed from the real
  agent-ix/spec-objects-architecture module. spec-objects-architecture has no
  Cargo crate to resolve this through, so this is an authored-minimal
  equivalent rather than a byte-for-byte vendored copy; the five schema files
  and four skeletons below ARE byte-for-byte the upstream files (same
  `data_schema.digest` values), only the surrounding manifest is pared down.
semantic:
  contract_version: 1.0.0
  semantic_core: 0.1.0
  package: agent-ix/spec-objects-architecture
  exports:
  - interface
  - part
  - port
  - connection
  - allocation
  imports: {}
  targets: [json-schema, markdown]
  mappings: [typed-table, sysml-fence, ocl-clause]
  compatibility_posture: additive
  legacy_forms: warning
archetypes: []
grammars: []
artifact_types: []
lint_rules: []
# FR-007: the edge verbs and roles the systems-model kinds (QSpec FR-152)
# introduce, needed by the `allowed_links`/`roles` below.
edge_types:
  owned_by: { description: "Systems element is owned by its owning type or part.", category: structural }
  typed_by: { description: "Systems element is typed by a type or interface.", category: structural }
  connects: { description: "Connection joins the ports at its source and target ends.", category: structural }
  allocates: { description: "Allocation names its source element (part, port or operation).", category: realization }
  allocated_to: { description: "Allocation names its target element (part).", category: realization }
roles:
  systems-part: { description: "A systems-model part (QSpec FR-152 Part)." }
  systems-port: { description: "A systems-model port owned by a part (QSpec FR-152 Port)." }
  systems-interface: { description: "An interface a systems port is typed by (QSpec FR-152 Interface)." }
object_types:
- name: interface
  roles: [externally-exposed, systems-interface]
  # FR-007: the QSpec FR-152 Interface kind — its features are fields and
  # operations, ordered as one sequence by `featureOrder`. Meaning id from
  # agent-ix/quire-specification#86 (FR-208).
  construct:
    identity: none
    shape: interface
    members:
      featureOrder: required
      fields: optional
      operations: optional
      clauses: optional
      relationships: optional
    meaning: quire.meaning.systems.interface/v1
  data_schema:
    schema: schemas/Interface.json
    digest: sha256:f9bb3844c23908de143c28035a9883795fe883e1bc4a0484e216ff6210f37c38
  body_extraction:
    yield_pattern:
      match:
        id: &id001
          from: frontmatter_field
          path:
          - id
          required: true
        title: &id002
          from: frontmatter_field
          path:
          - title
          required: true
        type: &id003
          from: frontmatter_field
          path:
          - type
          required: true
        contract_yaml:
          from: code_block
          after_heading: Contract
          language: yaml
          required: true
        operations:
          from: section_body
          after_heading: Operations
          required: false

# FR-007: the systems-model kinds QSpec FR-152 binds (part, port, connection,
# allocation; interface is the object type above). Each carries exactly the
# members FR-152's kind table states beyond the declaration key (the artifact
# id), authored as one row of one table and declared once as a `construct`
# (filament-core-service FR-035 CR-004). Meaning ids come from
# agent-ix/quire-specification#86 (FR-208).
- name: part
  roles: [systems-part]
  construct:
    identity: none
    shape: record
    members:
      owner: required
      declaredType: required
      multiplicity: required
      fields: forbidden
      operations: forbidden
    meaning: quire.meaning.systems.part/v1
  data_schema:
    schema: schemas/Part.json
    digest: sha256:8b8403cff5472ac2a1a2df7b1a1e10f120eeda9c27dea6de23a99685d03d71aa
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        part:
          from: table_row
          under_section: Part
          required: true
          assert:
            columns: [Owner, Declared Type, Multiplicity]
            min_rows: 1
- name: port
  roles: [systems-port]
  construct:
    identity: none
    shape: record
    members:
      owner: required
      direction: required
      interfaceType: required
      multiplicity: required
      fields: forbidden
      operations: forbidden
    references:
      owner: [systems-part]
      interfaceType: [systems-interface]
    meaning: quire.meaning.systems.port/v1
  data_schema:
    schema: schemas/Port.json
    digest: sha256:7d3c4cd18acdf4858a9d891dc159fda08dca5e2f6b365decf1d5c8d90bb3de9e
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        port:
          from: table_row
          under_section: Port
          required: true
          assert:
            columns: [Owner, Direction, Interface, Multiplicity]
            min_rows: 1
- name: connection
  construct:
    identity: none
    shape: record
    members:
      sourceEnd: required
      targetEnd: required
      flowDirection: required
      fields: forbidden
      operations: forbidden
    references:
      sourceEnd: [systems-port]
      targetEnd: [systems-port]
    meaning: quire.meaning.systems.connection/v1
  data_schema:
    schema: schemas/Connection.json
    digest: sha256:072acfc3afa7e48067b31febf390535b5c0c968fd3b9f0a8b038f4bfa514cd28
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        connection:
          from: table_row
          under_section: Connection
          required: true
          assert:
            columns: [Source, Source Multiplicity, Target, Target Multiplicity, Direction]
            min_rows: 1
- name: allocation
  construct:
    identity: none
    shape: record
    members:
      sourceElement: required
      targetElement: required
      fields: forbidden
      operations: forbidden
    references:
      targetElement: [systems-part]
    meaning: quire.meaning.systems.allocation/v1
  data_schema:
    schema: schemas/Allocation.json
    digest: sha256:69627d8fd777c3aab9ad57fbde85667250b9a9fa483506e32c0ffc8adddc626c
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        allocation:
          from: table_row
          under_section: Allocation
          required: true
          assert:
            columns: [Source, Target]
            min_rows: 1
