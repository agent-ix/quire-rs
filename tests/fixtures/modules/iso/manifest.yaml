manifest_version: 1.0.0
name: spec-artifacts-iso
version: 0.1.0
description: 'Filament Module: ISO-style spec artifacts (FR, NFR, StR, US, IT, TC, AC, CON) — frontmatter JSON Schemas + body_extraction + iso-spec-core grammar'
archetypes:
- kind: spec
  name: Spec
  description: Container holding ISO-style requirement artifacts
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - StR
    - FR
    - NFR
    - US
    - IT
    - TC
grammars:
- name: iso-spec-core
  version: 0.1.0
  description: ISO-style requirements spec grammar
  doc_kinds:
  - spec
artifact_types:
- name: FR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/fr-frontmatter.schema.json
  defaults:
    id_pattern: FR-{next:03d}
  allowed_links:
  - calls
  - publishes
  - consumes
  - triggers
  - reads
  - writes
  - requires
  - implements
  - depends_on
  - contains
  - transitions_to
  - references
  - constrains
  - supersedes
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        description:
          from: section_body
          after_heading: Description
          required: true
        specification:
          from: section_body
          after_heading: Specification
          required: true
        acceptance_criteria:
          from: section_body
          after_heading: Acceptance Criteria
          required: true
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: true
- name: NFR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/nfr-frontmatter.schema.json
  defaults:
    id_pattern: NFR-{next:03d}
  allowed_links:
  - constrains
  - references
  - depends_on
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        quality_attribute:
          from: section_body
          after_heading: Quality Attribute
          required: true
        statement:
          from: section_body
          after_heading: Statement
          required: true
        scope:
          from: section_body
          after_heading: Scope
          required: true
        measurement_and_evaluation:
          from: section_body
          after_heading: Measurement and Evaluation
          required: true
        verification:
          from: section_body
          after_heading: Verification
          required: true
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: true
- name: StR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/str-frontmatter.schema.json
  defaults:
    id_pattern: StR-{next:03d}
  allowed_links:
  - satisfied_by
  - depends_on
  - references
  examples: []
  lint_rules_ref: []
