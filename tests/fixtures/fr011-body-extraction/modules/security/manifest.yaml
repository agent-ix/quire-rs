      field: id
      present: true
    check: dossier-classification-title-facts
    rationale: The records-of-processing dossier names classifications by their authored title from the flow report.
  - name: dossier-part-delivery-facts
    subject: [part]
    match:
    - path:
      - edge: delivers_to
        direction: outgoing
        to: [data_sink]
      field: id
      present: true
    unless_any:
