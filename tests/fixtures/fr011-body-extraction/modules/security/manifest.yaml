    unless_any:
    - path: []
      field: id
      present: true
    check: dossier-processing-activity-purpose-facts
    rationale: The records-of-processing dossier reports authored purposes when present.
  - name: dossier-processing-activity-data-subject-facts
    subject: [processing_activity]
    match:
    - path: []
      field: data_subject_categories
      present: true
    unless_any:
    - path: []
      field: id
      present: true
    check: dossier-processing-activity-data-subject-facts
    rationale: The records-of-processing dossier reports authored data-subject categories when present.
  - name: dossier-processing-activity-retention-facts
    subject: [processing_activity]
    match:
    - path: []
      field: retention
      present: true
    unless_any:
