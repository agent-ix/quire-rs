    rationale: The records-of-processing dossier follows authored part delivery edges through the flow report.
  required_relations:
  # The same statement about the scored artefact rather than the mechanism: a
  # risk with no treatment was assessed and then dropped.
  - name: risk-has-treatment
    from: risk
    where: {field: decision, values: [undecided, not_accepted]}
    edges: [mitigates]
    to: []
    direction: incoming
    check: untreated-risk
  - name: processing-activity-scopes-nothing
    from: processing_activity
    edges: [scopes]
    to: [connection, data_sink, part]
    direction: outgoing
    check: processing-activity-scopes-nothing
  # `direction: incoming` throughout, because the mitigation is authored from
  # the control's or requirement's end — a control says what it mitigates. A
  # threat listing its own controls would duplicate the fact and let the two
  # drift.
  #
  # DELIBERATELY NOT DECLARED: `vulnerability`. #5 names "threat/hazard/risk"
  # and a vulnerability is a property of an implementation rather than a thing
  # the specification owes a response to. Adding it would widen the ticket.
  #
  # The reverse direction (PLAT-1477): a security-classified requirement owes
  # an upstream exposure it answers, else it is unjustified scope. The
  # classification is the `quality_attribute` frontmatter field spec-artifacts-iso
  # already declares on `NFR`; `where` (quire-rs FR-058) narrows the obligation to
  # NFRs holding `security`, so a performance NFR is never reported. The NFR
  # authors the edge, so `direction: outgoing`. The threat or risk an NFR
  # answers often lives in another repository; loading that repository into
  # the corpus resolves the constrained `to` (FR-085).
  - name: security-nfr-has-mitigation-target
    from: NFR
    where: {field: quality_attribute, values: [security]}
    edges: [mitigates]
    to: [threat, risk]
    direction: outgoing
    check: unjustified-security-nfr
  # A component that serves no requirement is unjustified scope (PLAT-1598).
  # The `serves` frontmatter list is the single authored source; the engine
  # harvests each ix:// value in it as a `references` edge, which this rule reads
  # (a manifest cannot bind a list field to a typed verb). Reviewer-authored;
  # promotion never writes it. A cross-repository target satisfies the
  # constrained `to` once the repositories are loaded together.
  - name: soup-record-serves-requirement
    from: soup_record
    edges: [references]
    to: [FR, NFR, StR]
    direction: outgoing
    check: soup-serves-no-requirement
  # FR-030: a requirement a SOUP record references is asked for the requirements
  # placed on that SOUP item. `from` is the requirement, not the record, so a
  # class policy that reads design relations per requirement gets a row. The
  # statement is authored by a person on an FR or NFR with `soup_requirement_for`
  # toward the served requirement, or by the served requirement as the inverse.
  # `when_any` (quire-rs FR-058) scopes the rows to requirements a resolved
  # soup_record references; elsewhere the relation yields no row and no finding.
  - name: fr-has-soup-requirements
    from: FR
    edges: [soup_requirement_for]
    to: [FR, NFR]
    direction: incoming
    check: fr-without-soup-requirements
    when_any:
    - {verb: references, direction: incoming, other: [soup_record]}
  - name: nfr-has-soup-requirements
    from: NFR
    edges: [soup_requirement_for]
    to: [FR, NFR]
    direction: incoming
    check: nfr-without-soup-requirements
    when_any:
    - {verb: references, direction: incoming, other: [soup_record]}
  - name: threat-model-scopes-something
    from: threat_model
    edges: [scopes]
    to: []
    direction: outgoing
    check: threat-model-scopes-nothing
  remediations:
  - name: encrypt-in-transit
    description: Add a control with this safeguard protecting the affected connection.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: encrypt-in-transit}
  - name: encrypt-at-rest
    description: Add a control with this safeguard protecting the affected sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: encrypt-at-rest}
  - name: anonymize
    description: Add a control with this safeguard protecting the affected connection or sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: anonymize}
  - name: pseudonymize
    description: Add a control with this safeguard protecting the affected connection or sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: pseudonymize}
  - name: obtain-consent
    description: Add a control with this safeguard protecting the affected connection or sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: obtain-consent}
  - name: restrict-region
    description: Add a control with this safeguard protecting the affected connection or sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: restrict-region}
  - name: validate-before-display
    description: Add a control with this safeguard protecting the affected connection or sink.
    adds: {edge: protects, direction: incoming, from: control, field: safeguards, value: validate-before-display}
  - name: obtain-processor-agreement
    description: Set the affected sink's processor_agreement field to covered.
    sets: {field: processor_agreement, value: covered}
  - name: remove-from-sink
    description: Remove the connection's delivers_to relationship to this sink when it is the first path step.
    removes: {edge: delivers_to, direction: incoming}
  # FR-030 names the two SOUP-requirement relations as design relations so the
  # design join, `quire matrix --strict` and quoin's `soup-requirements` kind read
  # them. FR-013's `soup-record-serves-requirement` is deliberately not listed.
  design_relations: [fr-has-soup-requirements, nfr-has-soup-requirements]
  #
  # A risk that transitively arises from itself states nothing, and no
  # per-document check can see it: the defect is a property of the graph.
  acyclic_edges:
  - arises_from

lexicon:
  token: {definition: a bearer credential representing identity or grant}
  secret: {definition: "a confidential value (key, password) kept out of code"}
  scope: {definition: a named permission boundary on a grant}
  claim: {definition: an assertion carried in a token}
  permission: {definition: an allowed action on a resource}
  credential: {definition: data proving an identity}
  certificate: {definition: a signed binding of identity to a public key}
  signature: {definition: a cryptographic proof of integrity/origin}
  principal: {definition: an authenticated identity (user/service)}
  keypair: {definition: a public/private cryptographic key pair}
  nonce: {definition: a single-use value preventing replay}
  hash: {definition: a fixed-size digest of input}
  cipher: {definition: an encryption/decryption algorithm}
  audit: {definition: "a recorded, tamper-evident event trail"}
  policy: {definition: a declarative rule governing access or behavior}
