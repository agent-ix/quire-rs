- name: spec-artifacts-iso
  version_range: ^0.3.0
- name: spec-objects-safety
  version_range: ^0.4.1
grammar_severity:
  trace:crossing-without-threat: error
  trace:classified-sink-without-threat: error
  trace:threat-without-treatment: error
semantic:
  contract_version: 1.0.0
  package: agent-ix/spec-objects-security
  exports:
  - auth_flow
  - permission
  - scope
  - role
  - secret
  - encryption_key
  - session_config
  - data_classification
  - trust_boundary
  - audit_event
  - csrf_token
  - cors_policy
  - password_policy
  - mfa_method
  - jwt_claim
  - threat
  - control
  - risk
  - vulnerability
  - anomaly
  - asset
  - attack_surface
  - policy
  - audit_finding
  - soup_record
  - scope_exclusion
  - threat_model
  - processing_activity
  imports: {}
  targets: [json-schema, markdown]
  mappings: [typed-table, sysml-fence, ocl-clause, record-sections]
  compatibility_posture: additive
  legacy_forms: warning
clause_sets:
- clauses/nist-sp800-53-5.2.0.json
- clauses/owasp-asvs-5.0.0.json
roles:
  trust_boundary: {description: A boundary between zones with different trust levels.}
nav:
  category:
    slug: security
    label: Security
    icon: ShieldCheck
    order: 54
edge_types:
  scopes: { description: "A security model or processing activity scopes a target element.", category: governance }
  considers: { description: "Threat model considers the threat at the target.", category: governance }
  soup_requirement_for: { description: "An FR or NFR states the requirements placed on the SOUP item that serves the target requirement.", category: traceability, inverse: has_soup_requirement }
archetypes: []
grammars:
- name: security-artifacts
  version: 0.1.0
  description: Security process artifacts authored by product teams
  doc_kinds:
  - vulnerability_management_plan
artifact_types:
- name: vulnerability_management_plan
