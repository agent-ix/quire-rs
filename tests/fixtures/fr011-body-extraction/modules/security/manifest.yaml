# FR-043: concrete-term lexicon — security / identity / auth objects.
# FR-058 (quire-rs): upward-trace completeness — the second half of
# agent-ix/spec-objects-security#5. Declaration, not code: the engine holds no
# archetype name, no verb and no direction.
#
# A threat nobody controls and a risk nobody treats are both perfectly
# well-formed documents that pass every schema and grammar check, and both are
# evidence of an unaddressed exposure. Nothing that reads a document on its own
# can see it; only reading the edge set upward can.
traceability:
  flow_rules:
  - name: health-across-untrusted-boundary
    subject: [connection]
    match:
    - path:
      - edge: carries
        direction: outgoing
        to: [data_classification]
      field: regulated_categories
      any_of: [health]
    - path:
      - edge: crosses
        direction: outgoing
        to: [trust_boundary]
      field: trust_level
      any_of: [untrusted, unknown]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [encrypt-in-transit]
    check: health-across-untrusted-boundary
    rationale: Health data crossing an untrusted boundary needs an encrypt-in-transit safeguard.
    remediations: [encrypt-in-transit]
  - name: personal-across-untrusted-boundary
    subject: [connection]
    match:
    - path:
      - edge: carries
        direction: outgoing
        to: [data_classification]
      field: regulated_categories
      any_of: [personal]
    - path:
      - edge: crosses
        direction: outgoing
        to: [trust_boundary]
      field: trust_level
      any_of: [untrusted, unknown]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [encrypt-in-transit]
    check: personal-across-untrusted-boundary
    rationale: Personal data crossing an untrusted boundary needs an encrypt-in-transit safeguard.
    remediations: [encrypt-in-transit]
  - name: regulated-data-to-uncovered-processor
    subject: [data_sink]
    match:
    - any_path:
      - - edge: delivers_to
          direction: incoming
          to: [connection]
        - edge: carries
          direction: outgoing
          to: [data_classification]
      - - edge: carries
          direction: outgoing
          to: [data_classification]
      field: regulated_categories
      any_of: [health, personal]
    - path: []
      field: processor_agreement
      any_of: [not_covered, unknown]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [anonymize]
    - path: []
      field: processor_agreement
      any_of: [covered]
    check: regulated-data-to-uncovered-processor
    rationale: Health or personal data reaching a sink needs an agreement or anonymization safeguard.
    remediations: [obtain-processor-agreement, anonymize]
  - name: health-in-llm-prompt-or-tool-call
    subject: [data_sink]
    match:
    - path: []
      field: kind
      any_of: [llm_prompt, tool_call]
    - any_path:
      - - edge: delivers_to
          direction: incoming
          to: [connection]
        - edge: carries
          direction: outgoing
          to: [data_classification]
      - - edge: carries
          direction: outgoing
          to: [data_classification]
      field: regulated_categories
      any_of: [health]
    - path: []
      field: processor_agreement
      any_of: [not_covered, unknown]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [anonymize, pseudonymize]
    - path: []
      field: processor_agreement
      any_of: [covered]
    check: health-in-llm-prompt-or-tool-call
    rationale: Health data sent to a model prompt or tool call needs an agreement or privacy safeguard.
    remediations: [obtain-processor-agreement, anonymize, pseudonymize]
  - name: health-in-log
    subject: [data_sink]
    match:
    - path: []
      field: kind
      any_of: [log]
    - any_path:
      - - edge: delivers_to
          direction: incoming
          to: [connection]
        - edge: carries
          direction: outgoing
          to: [data_classification]
      - - edge: carries
          direction: outgoing
          to: [data_classification]
      field: regulated_categories
      any_of: [health]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [pseudonymize]
    check: health-in-log
    rationale: Health data reaching a log needs a pseudonymization safeguard.
    remediations: [pseudonymize]
  - name: health-display-unvalidated
    subject: [data_sink]
    match:
    - path: []
      field: kind
      any_of: [ui_screen]
    - any_path:
      - - edge: delivers_to
          direction: incoming
          to: [connection]
        - edge: carries
          direction: outgoing
          to: [data_classification]
      - - edge: carries
          direction: outgoing
          to: [data_classification]
      field: regulated_categories
      any_of: [health]
    unless_any:
    - path:
      - edge: protects
        direction: incoming
        to: [control]
      field: safeguards
      any_of: [validate-before-display]
    check: health-display-unvalidated
    rationale: Health data shown on a screen needs validation before display.
    remediations: [validate-before-display]
  - name: crossing-without-threat
    subject: [connection]
    match:
    - path:
      - edge: scopes
        direction: incoming
        to: [threat_model]
      field: id
      present: true
    - path:
      - edge: carries
        direction: outgoing
        to: [data_classification]
      field: id
      present: true
    - path:
      - edge: crosses
        direction: outgoing
        to: [trust_boundary]
      field: id
      present: true
    unless_any:
    - path:
      - edge: threatens
        direction: incoming
        to: [threat]
      field: id
      present: true
    check: crossing-without-threat
    rationale: A scoped connection carrying classified data across a trust boundary needs a threat in its threat model.
  - name: classified-sink-without-threat
    subject: [data_sink]
    match:
    - path:
      - edge: scopes
        direction: incoming
        to: [threat_model]
      field: id
      present: true
    - any_path:
      - - edge: delivers_to
          direction: incoming
          to: [connection]
        - edge: carries
          direction: outgoing
          to: [data_classification]
      - - edge: carries
          direction: outgoing
          to: [data_classification]
      field: id
      present: true
    unless_any:
    - path:
      - edge: threatens
        direction: incoming
        to: [threat]
      field: id
      present: true
    check: classified-sink-without-threat
    rationale: A scoped sink receiving classified data needs a threat in its threat model.
  - name: threat-without-treatment
    subject: [threat]
    match:
    - path:
      - edge: considers
        direction: incoming
        to: [threat_model]
      field: id
      present: true
    unless_any:
    - path:
      - edge: mitigates
        direction: incoming
        to: [control]
      field: id
      present: true
    - path:
      - edge: arises_from
        direction: incoming
        to: [risk]
      field: decision
      any_of: [accepted]
    check: threat-without-treatment
    rationale: A threat considered in a threat model needs a mitigating control or an explicitly accepted risk.
  # FR-207 consumes model facts only through quire.flow-report/v1. These
  # no-finding selectors make the authored dossier fields and scope edges
  # part of that report without assigning them a security judgement.
  - name: dossier-processing-activity-scope-facts
    subject: [processing_activity]
    match:
    - path:
      - edge: scopes
        direction: outgoing
        to: [connection, data_sink, part]
      field: id
      present: true
    unless_any:
    - path: []
      field: id
      present: true
    check: dossier-processing-activity-scope-facts
    rationale: The records-of-processing dossier reads the activity's authored scope edges from the flow report.
  - name: dossier-processing-activity-core-facts
    subject: [processing_activity]
    match:
    - path: []
      field: role
      present: true
    - path: []
      field: controller
      present: true
    - path: []
      field: home_regions
      present: true
    unless_any:
    - path: []
      field: id
      present: true
    check: dossier-processing-activity-core-facts
    rationale: The records-of-processing dossier reports the activity's authored role, controller and home regions.
  - name: dossier-processing-activity-processor-facts
    subject: [processing_activity]
    match:
    - path: []
      field: processor
      present: true
    unless_any:
    - path: []
      field: id
      present: true
    check: dossier-processing-activity-processor-facts
    rationale: The records-of-processing dossier reports an authored processor contact when present.
  - name: dossier-processing-activity-joint-controller-facts
    subject: [processing_activity]
