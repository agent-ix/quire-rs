# FR-054 fixture: a two-method catalog.
#
# Nothing here is engine knowledge. `class` is a free string (this module uses
# ISO 29148 IADT), and the `applicability` rule names are the module's own —
# the engine stores and surfaces them without interpreting either.
name: catalog-one
version: 0.1.0
description: Verification-method catalog fixture (FR-054)
artifact_types:
- name: FR
  defaults:
    id_pattern: FR-{next:03d}
verification_catalog:
  property-based-testing:
    name: Property-based testing
    class: Test
    definition: >-
      Execute a property over generated inputs, asserting an invariant rather
      than a fixed expected value.
    evidence_kind: test-run
    applicability:
      property_shapes: [round-trip, idempotence, invariant]
      characteristics: [universally-quantified]
    tooling: [proptest, fast-check, hypothesis]
  architecture-conformance:
    name: Architecture conformance
    class: Analysis
    definition: >-
      Check the implemented dependency structure against the declared one.
    evidence_kind: static-analysis
    # An ordinal posture, not a measurement. The value is the module's own —
    # the engine stores and surfaces it without interpreting it (CON-6).
    cost: assurance-only
    applicability:
      # A rule name the engine has never heard of, on purpose (CON-2).
      forbidden_dependency_edges: ["*"]
