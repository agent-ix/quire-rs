# Non-ISO traceability declaration (FR-050-AC-8 fixture).
#
# Deliberately shares no vocabulary with the ISO shape: a different archetype
# (`Rule`), a different id pattern (`R-12/C-3`), different column names, and a
# word-based status vocabulary. The engine must produce a correct rollup from
# this declaration alone.
name: traceability-alt
version: 0.1.0
description: Non-ISO traceability model fixture
artifact_types:
- name: Rule
  defaults:
    id_pattern: R-{next:03d}
traceability:
  trace_targets:
  - name: clause
    archetype: Rule
    section: Clauses
    id_column: Clause
  - name: check
    document: checks.md
    section: Checks
    id_column: Check
  document_references:
  - name: evidence
    archetype: Rule
    section: Clauses
    column: Evidence
    row_id_column: Clause
    pattern: 'checked by (C-\d+)'
    targets: [check]
  - name: covers
    document: checks.md
    section: Checks
    column: Covers
    row_id_column: Check
    pattern: '(R-\d+-C-\d+)'
    targets: [clause]
  status:
    column: State
    complete: ["done"]
    pending: ["planned", "partial"]
    failed: ["broken"]
  trace_tags:
    markers:
    - name: alt-marker
      language: rust
      pattern: '#\[covers\(([^)]*)\)\]'
