# FR-053 / agent-ix/quire-rs#460 fixture: an "object" archetype whose own id
# joins KIND and NUMBER with an underscore (`interface_004`), rather than the
# requirement archetypes' hyphen (`FR-001`). Its Acceptance Criteria table
# still mints `interface_004-AC-1` the ordinary way — the engine reads the ID
# column verbatim and knows no archetype (FR-053-CON-1) — so registering the
# kind is exactly this declaration, nothing more.
name: traceability-obligations-interface
version: 0.1.0
description: Obligation sources for an object-style archetype (FR-053 fixture, #460)
artifact_types:
- name: Interface
  grammar_ref: iso-spec-core
  defaults:
    id_pattern: interface_{next:03d}
traceability:
  trace_targets:
  - name: interface-acceptance-criterion
    archetype: Interface
    section: Acceptance Criteria
    id_column: ID
  obligations:
  - name: interface-acceptance-criterion
    target: interface-acceptance-criterion
    statement_column: Criteria
    method_column: Verification
    criticality_column: Priority
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(([^)]*)\)\]'
      template: '#[trace({ids})]'
