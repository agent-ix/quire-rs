# CR-015 fixture: a module that opts into both reference normalizations.
name: traceability-plain
version: 0.1.0
description: Same declaration with both normalizations off (CR-015 control)
artifact_types:
- name: FR
  defaults:
    id_pattern: FR-{next:03d}
- name: TestMatrix
  defaults:
    id_pattern: TM-{next:03d}
traceability:
  trace_targets:
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  - name: test-case
    archetype: TestMatrix
    section: Test Cases
    id_column: ID
  document_references:
  - name: verification
    archetype: FR
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '(TC-\d+)'
    targets: [test-case]
