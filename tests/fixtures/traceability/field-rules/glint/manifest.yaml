# members as Glyph's in another order, so the two vocabularies disagree.
name: field-rules-glint
version: 0.1.0
description: Carried field whose enum disagrees with Glyph's (quire-rs FR-090)
archetypes:
- kind: Glint
  name: Glint
  frontmatter_schema_ref: schemas/glint.schema.json
