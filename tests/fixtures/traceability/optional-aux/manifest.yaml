# A fleet module's *optional by convention* auxiliary declarations (CR-059).
#
# `iso`, plus two declarations naming auxiliary documents this repository does
# not have. That is the shape `spec-artifacts-process` ships across 200+
# repositories: the module names every auxiliary document any of them *might*
# have — `spec/evals.md`, `spec/matrix.md` — and an individual repository whose
# matrix is `tests.md` has neither.
#
# The model mints normally through the FR archetype and `tests.md`, so the two
# absences are ordinary and must stay out of the report (agent-ix/quire-rs#129).
name: traceability-optional-aux
version: 0.1.0
description: ISO-shaped model with optional auxiliary documents this repo lacks
artifact_types:
- name: FR
  grammar_ref: iso-spec-core
  defaults:
    id_pattern: FR-{next:03d}
- name: TC
  defaults:
    id_pattern: TC-{next:03d}
traceability:
  trace_targets:
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  - name: test-case
    document: tests.md
    section: Test Cases
    id_column: ID
  # Optional: a repository that runs agent evals keeps them in their own matrix.
  - name: test-case-evals
    document: evals.md
    section: Test Cases
    id_column: ID
  document_references:
  - name: verification
    archetype: FR
    section: Acceptance Criteria
    column: Verification
    row_id_column: ID
    pattern: '\((TC-\d+)\)'
    targets: [test-case, test-case-evals]
  - name: traces-to
    document: tests.md
    section: Test Cases
    column: Traces To
    row_id_column: ID
    pattern: '((?:StR|US|FR|NFR)-\d+(?:-(?:AC|CON)-\d+)?|IT-\d+(?:-SC-\d+)?)'
    targets: [acceptance-criterion]
  # Optional: the same column in a repository whose matrix is named `matrix.md`.
  - name: traces-to-matrix
    document: matrix.md
    section: Test Cases
    column: Traces To
    row_id_column: ID
    pattern: '((?:StR|US|FR|NFR)-\d+(?:-(?:AC|CON)-\d+)?|IT-\d+(?:-SC-\d+)?)'
    targets: [acceptance-criterion]
  status:
    column: Status
    complete: ["✅"]
    pending: ["🚧", "⚠️"]
    failed: ["❌"]
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(([^)]*)\)\]'
      template: '#[trace({ids})]'
