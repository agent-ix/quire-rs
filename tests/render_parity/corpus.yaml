# Render-parity corpus (Tasks 011 / 012 / 013).
#
# Two module sources:
#   - `demo`: self-contained hand-authored fixture so the harness
#     proves wiring even on a host without spec-artifacts-*.
#   - `iso`: vendored copy of spec-artifacts-iso/spec_artifacts_iso
#     (8 archetypes: FR, NFR, StR, US, IT, TC, AC, CON).
#
# `expected.md` files are regenerated from the Python Jinja2 reference
# via `scripts/regenerate_parity_fixtures.sh`; see PROVENANCE.md for
# the venv pin.

modules:
  - path: ./modules/demo
    name: demo
  - path: ./modules/iso
    name: spec-artifacts-iso

cases:
  - archetype: demo-item
    input: cases/demo-item-001.input.json
    expected: cases/demo-item-001.expected.md
  - archetype: demo-item
    input: cases/demo-item-002.input.json
    expected: cases/demo-item-002.expected.md
  - archetype: FR
    input: cases/iso/fr-001.input.json
    expected: cases/iso/fr-001.expected.md
  - archetype: NFR
    input: cases/iso/nfr-001.input.json
    expected: cases/iso/nfr-001.expected.md
  - archetype: StR
    input: cases/iso/str-001.input.json
    expected: cases/iso/str-001.expected.md
  - archetype: US
    input: cases/iso/us-001.input.json
    expected: cases/iso/us-001.expected.md
  - archetype: IT
    input: cases/iso/it-001.input.json
    expected: cases/iso/it-001.expected.md
  - archetype: TC
    input: cases/iso/tc-001.input.json
    expected: cases/iso/tc-001.expected.md
  - archetype: AC
    input: cases/iso/ac-001.input.json
    expected: cases/iso/ac-001.expected.md
  - archetype: CON
    input: cases/iso/con-001.input.json
    expected: cases/iso/con-001.expected.md
