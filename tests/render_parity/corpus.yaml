# Render-parity corpus.
#
# Tasks 011 / 012 / 013. Currently ships the bootstrap `demo`
# module + 2 cases — proves the harness wiring without requiring
# the Python reference renderer or any external corpus.
#
# Task 013 (full sweep) appends spec-artifacts-* modules + 30+
# fixture pairs whose `expected.md` files are regenerated by
# `scripts/regenerate_parity_fixtures.sh` against the Python
# reference. Until that pipeline runs on a fresh host, those
# entries live in the sibling repos.

modules:
  - path: ./modules/demo
    name: demo

cases:
  - archetype: demo-item
    input: cases/demo-item-001.input.json
    expected: cases/demo-item-001.expected.md
  - archetype: demo-item
    input: cases/demo-item-002.input.json
    expected: cases/demo-item-002.expected.md
