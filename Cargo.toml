[package]
name = "quire-rs"
version = "0.19.0"
edition = "2021"
rust-version = "1.75"
description = "High-performance Rust templating + parsing engine for the Filament/Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-rs"

[lib]
name = "quire_rs"
path = "src/lib.rs"
# `cdylib` for the maturin-built Python extension (feature = "python");
# `rlib` for the normal Rust library, benches, and tests.
crate-type = ["cdylib", "rlib"]

[lints.rust]
# `loom` is set by the scheduled NFR-017 concurrency lane (`make loom`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
# Tilde-pinned per NFR-009 for load-bearing parser primitives;
# caret-pinned for ecosystem-standard helpers.
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
serde_yaml = "^0.9"
# Stable SHA-256 record ids for canonical Filament extraction (FR-045).
sha2 = "^0.10"
indexmap = { version = "^2", features = ["serde"] }
thiserror = "^2"
# Regex driver for the Query API (FR-010). Patterns are author-side
# (section numbers, bullet shapes, fence info strings) so this is on
# the Query/extract path, not a hot inner loop.
regex = "^1"
# Placeholder validator crate; Task 026 ADR will revisit with bench data.
# `default-features = false` to drop the `resolve-http`/`reqwest`/`cli` defaults
# — quire-rs is filesystem-only (StR-001, FR-013, hard rule: no network deps).
# The `resolve-file` activation is feature-gated (`resolve-file` feature, on
# by default) so the `wasm` feature can opt out — `jsonschema 0.18`'s
# resolve-file path calls `url::Url::to_file_path`, which is unavailable on
# `wasm32-unknown-unknown`. See the `wasm` feature below + spec FR-013.
jsonschema = { version = "~0.18", default-features = false }
# v0.3 corpus: parallel walk + parse (FR-024). Caret-pinned ecosystem helpers.
# `ignore` = ripgrep's gitignore-aware walker; `rayon` = data-parallel parse fan-out.
ignore = "^0.4"
rayon = "^1"
# Document identity (CR-002): `uuid` parses the durable frontmatter `uuid`;
# the `v7` feature is used when creating a new artifact (time-ordered id).
uuid = { version = "^1", features = ["v7", "serde"] }
# Python bindings (FR-023), feature-gated. Tilde-pinned (load-bearing FFI,
# NFR-009). 0.28 supports CPython through 3.14; abi3 floor py39 gives one
# forward-compatible wheel (NFR-016). `extension-module` drops libpython
# linkage so the wheel loads in any host interpreter.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
# wasm entropy source for `uuid` v7 under `wasm32-unknown-unknown` (see `wasm` feature).
getrandom = { version = "^0.3", features = ["wasm_js"], optional = true }

[dev-dependencies]
proptest = "^1"
criterion = "^0.5"

# Concurrency-permutation harness (NFR-017). Only compiled under
# `--cfg loom`; the scheduled `make loom` lane sets that flag. Models the
# FR-024 data-parallel collect abstractly (loom cannot model rayon).
[target.'cfg(loom)'.dependencies]
loom = "^0.7"

[features]
# Native default: include filesystem `$ref` resolution in jsonschema.
default = ["resolve-file"]
python = ["dep:pyo3"]
# Measurement-only. Re-enables the `ac:no-observable-outcome` check CR-014
# retired, so it can be re-measured over the corpus with the mechanical fixes
# CR-014/CR-017 applied (agent-ix/quire-rs#18). NEVER enabled in a shipping
# build: `make ci`, the default build, the wheel and the wasm build all leave
# it off. Build the measurement wheel with
# `maturin build --features python,remeasure`.
remeasure = []
# The FR-052 recall-widening experiment (agent-ix/quire-rs#45) carried three
# candidate rules here, each behind its own measurement-only feature. It is
# **finished** (CR-030): `recall-subject-determiner` measured 30/30 precision on
# its own newly-caught cells and is now unconditional classifier behaviour, so
# it has no feature; `recall-shape-axis` (70.0%) and `recall-generic-subject`
# (56.7%) missed the ≥85% gate fixed in advance and were **deleted** — not
# narrowed and not left gated, because a dormant feature is a rule nobody
# measures again. A narrower variant is a new question with its own experiment.
# Activate jsonschema's `resolve-file` cargo feature. Gated so the
# `wasm` build can opt out (jsonschema 0.18's resolve-file path calls
# `url::Url::to_file_path`, which doesn't exist on wasm32). See FR-013.
resolve-file = ["jsonschema/resolve-file"]
# Filesystem-free build target. Drops `resolve-file` so the crate
# compiles for `wasm32-unknown-unknown`. Schemas must be passed
# in-memory via `Registry::from_inline_parts` (see FR-013 wasm
# amendment); `Registry::load_from` / `load_module` / `from_env`
# / `from_default` remain available but operate against whatever
# filesystem the wasm host exposes (typically none under
# `--target web`).
wasm = ["uuid/js", "dep:getrandom"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "load"
harness = false

[[bench]]
name = "validator_choice"
harness = false

[[bench]]
name = "load_repo"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
