[workspace]
# The root package stays the workspace default-member (mirrors quire-code-rs's
# own choice, PLAT-841): existing tooling that runs bare `cargo build`/`cargo
# test` from the repo root keeps building exactly what it built before
# `crates/quire-rust-extraction` existed. That crate is a member so
# `cargo test --workspace` and the dependency-boundary gate exercise it too,
# but it is never implicitly selected on its own.
members = [".", "crates/quire-rust-extraction", "crates/quire-fixtures"]
default-members = ["."]
resolver = "2"

[package]
name = "quire-rs"
version = "0.46.0"
edition = "2021"
rust-version = "1.98.1"
description = "High-performance Rust templating + parsing engine for the Filament/Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-rs"

[lib]
name = "quire_rs"
path = "src/lib.rs"
# `cdylib` for the maturin-built Python extension (feature = "python");
# `rlib` for the normal Rust library, benches, and tests.
crate-type = ["cdylib", "rlib"]

[lints.rust]
# `loom` is set by the scheduled NFR-017 concurrency lane (`make loom`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
# Tilde-pinned per NFR-009 for load-bearing parser primitives;
# caret-pinned for ecosystem-standard helpers.
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
# ADR-0012: keep the established import name while pinning the maintained
# YAML Organization package exactly; YAML behavior is identity-bearing.
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }
# Stable SHA-256 record ids for canonical Filament extraction (FR-045).
sha2 = "^0.10"
indexmap = { version = "^2", features = ["serde"] }
thiserror = "^2"
# Regex driver for the Query API (FR-010). Patterns are author-side
# (section numbers, bullet shapes, fence info strings) so this is on
# the Query/extract path, not a hot inner loop.
regex = "^1"
# Placeholder validator crate; Task 026 ADR will revisit with bench data.
# `default-features = false` to drop the `resolve-http`/`reqwest`/`cli` defaults
# — quire-rs is filesystem-only (StR-001, FR-013, hard rule: no network deps).
# The `resolve-file` activation is feature-gated (`resolve-file` feature, on
# by default) so the `wasm` feature can opt out — `jsonschema 0.18`'s
# resolve-file path calls `url::Url::to_file_path`, which is unavailable on
# `wasm32-unknown-unknown`. See the `wasm` feature below + spec FR-013.
jsonschema = { version = "~0.18", default-features = false, features = ["draft202012"] }
# v0.3 corpus: parallel walk + parse (FR-024). Caret-pinned ecosystem helpers.
# `ignore` = ripgrep's gitignore-aware walker; `rayon` = data-parallel parse fan-out.
ignore = "^0.4"
rayon = "^1"
# Module-declared path scoping for the traceability model (FR-050-AC-15).
# Already in the tree via `ignore`, so this promotes a transitive crate to a
# direct dependency rather than adding one.
globset = "^0.4"
# Document identity (CR-002): `uuid` parses the durable frontmatter `uuid`;
# the `v7` feature is used when creating a new artifact (time-ordered id).
uuid = { version = "^1", features = ["v7", "serde"] }
# Python bindings (FR-023), feature-gated. Tilde-pinned (load-bearing FFI,
# NFR-009). 0.28 supports CPython through 3.14; abi3 floor py39 gives one
# forward-compatible wheel (NFR-016). `extension-module` drops libpython
# linkage so the wheel loads in any host interpreter.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
# wasm entropy source for `uuid` v7 under `wasm32-unknown-unknown` (see `wasm` feature).
getrandom = { version = "^0.3", features = ["wasm_js"], optional = true }
unicode-normalization = "0.1"
# Dependency-boundary crate (PLAT-843, widened to all three grammars by
# PLAT-851): the one place in this workspace that names
# `quire-code-parse`/`tree-sitter` — see
# `crates/quire-rust-extraction/src/lib.rs` and its
# `tests/dependency_boundary.rs`. `src/symbols/rust.rs` walks the tree this
# re-exports; it never names `tree-sitter` itself. Still named
# `quire-rust-extraction` even though it now also wraps the `python` and
# `typescript` grammars — the rename is tracked as PLAT-876, deliberately
# deferred so this slice makes zero edits to `rust.rs` (see the crate's own
# `Cargo.toml` for why).
#
# `optional = true`, gated per grammar by the `rust-symbols`/`python-symbols`/
# `typescript-symbols` features below: `quire-code-parse` pulls in a
# `tree-sitter-<lang>` grammar, which compiles a C parser via a `cc`-crate
# build script, and none of the three can cross-compile for
# `wasm32-unknown-unknown` without a wasm-targeting C toolchain this
# workspace does not carry — the same cross-compilation shape `resolve-file`
# is already gated off `wasm` for, one dependency over. Each `*-symbols`
# feature activates only this crate's matching grammar feature
# (`quire-rust-extraction/rust` etc.), not the other two, so enabling one
# never pulls the other languages' C toolchains — see the crate's own
# `Cargo.toml` for the full reasoning.
quire-rust-extraction = { path = "crates/quire-rust-extraction", optional = true }

[dev-dependencies]
# The canonical Rust trace marker (FR-051). Zero runtime dependencies and a
# pass-through expansion, so it adds one crate to the dev graph and nothing
# to a consumer's: dev-dependencies are not transitive. Pinned to an exact
# tag, which satisfies NFR-009-AC-3 more strictly than a caret range.
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
# The Markdown -> semantic-core mapping fixture set quire-rs's own semantic
# tests exercise (PLAT-901). A workspace path dependency here; quoin (its
# other consumer, step 2 of PLAT-901) resolves the same crate as a git
# dev-dependency at the rev it already pins for the engine.
quire-fixtures = { path = "crates/quire-fixtures" }
# RAII temp dirs for tests that build throwaway trees (#215): the manual
# `std::env::temp_dir()` + `remove_dir_all` pattern leaks the tree on any
# assertion failure, because the cleanup line is never reached.
tempfile = "^3"
proptest = "^1"
criterion = "^0.5"
# Concurrency-permutation harness (NFR-017). Only compiled under
# `--cfg loom`; the scheduled `make loom` lane sets that flag. Models the
# FR-024 data-parallel collect abstractly (loom cannot model rayon).
[target.'cfg(loom)'.dependencies]
loom = "^0.7"

[features]
# Native default: include filesystem `$ref` resolution in jsonschema, and the
# tree-sitter-backed Rust, Python, and TypeScript symbol adapters — all three
# now use their grammar unconditionally (PLAT-843, PLAT-868, PLAT-882), so a
# default `cargo build`/`cargo test` must keep extracting every language the
# pre-port line-structural scanners always did.
default = ["resolve-file", "rust-symbols", "python-symbols", "typescript-symbols"]
python = ["dep:pyo3"]
# The Rust symbol adapter (FR-051, PLAT-843), gated so the `wasm` build can
# opt out — see `quire-rust-extraction`'s own dependency comment above for
# why. `src/symbols/mod.rs` falls back to a per-file diagnostic for
# `SourceLanguage::Rust` when this feature is off, rather than failing to
# compile; Python and TypeScript extraction are unaffected either way.
rust-symbols = ["dep:quire-rust-extraction", "quire-rust-extraction/rust"]
# The Python symbol adapter (FR-051, PLAT-868), same shape as `rust-symbols`
# one language over: gated so the `wasm` build can opt out (tree-sitter-python
# carries the identical C-toolchain cross-compilation problem `rust-symbols`'s
# own comment describes), and `src/symbols/mod.rs` falls back to a per-file
# diagnostic for `SourceLanguage::Python` when this feature is off, rather
# than failing to compile. Default: `python.rs` uses it unconditionally now
# that PLAT-868 has landed, so a default build must keep extracting Python
# the way the pre-port line-structural scanner always did. Named
# `python-symbols`, not `python`, because `python` is already taken above
# (the PyO3 bindings feature) and a bare `python` here would misleadingly
# pair with it.
python-symbols = ["dep:quire-rust-extraction", "quire-rust-extraction/python"]
# The TypeScript symbol adapter (FR-051, PLAT-882), gated exactly like
# `rust-symbols` so the `wasm` build can opt out — `tree-sitter-typescript`'s
# `cc`-crate build script cannot cross-compile to `wasm32-unknown-unknown`
# here either. `src/symbols/mod.rs` falls back to a per-file diagnostic for
# `SourceLanguage::Typescript` when this feature is off, rather than failing
# to compile. Default: `typescript.rs` uses it unconditionally now that
# PLAT-882 has landed, so a default build must keep extracting TypeScript
# the way it always did.
typescript-symbols = ["dep:quire-rust-extraction", "quire-rust-extraction/typescript"]
# Measurement-only. Re-enables the `ac:no-observable-outcome` check CR-014
# retired, so it can be re-measured over the corpus with the mechanical fixes
# CR-014/CR-017 applied (agent-ix/quire-rs#18). NEVER enabled in a shipping
# build: `make ci`, the default build, the wheel and the wasm build all leave
# it off. Build the measurement wheel with
# `maturin build --features python,remeasure`.
remeasure = []
# The FR-052 recall-widening experiment (agent-ix/quire-rs#45) carried three
# candidate rules here, each behind its own measurement-only feature. It is
# **finished** (CR-030): `recall-subject-determiner` measured 30/30 precision on
# its own newly-caught cells and is now unconditional classifier behaviour, so
# it has no feature; `recall-shape-axis` (70.0%) and `recall-generic-subject`
# (56.7%) missed the ≥85% gate fixed in advance and were **deleted** — not
# narrowed and not left gated, because a dormant feature is a rule nobody
# measures again. A narrower variant is a new question with its own experiment.
# Activate jsonschema's `resolve-file` cargo feature. Gated so the
# `wasm` build can opt out (jsonschema 0.18's resolve-file path calls
# `url::Url::to_file_path`, which doesn't exist on wasm32). See FR-013.
resolve-file = ["jsonschema/resolve-file"]
# Filesystem-free build target. Drops `resolve-file` so the crate
# compiles for `wasm32-unknown-unknown`. Schemas must be passed
# in-memory via `Registry::from_inline_parts` (see FR-013 wasm
# amendment); `Registry::load_from` / `load_module` / `from_env`
# / `from_default` remain available but operate against whatever
# filesystem the wasm host exposes (typically none under
# `--target web`).
wasm = ["uuid/js", "dep:getrandom"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "load"
harness = false

[[bench]]
name = "validator_choice"
harness = false

[[bench]]
name = "load_repo"
harness = false

[[bench]]
name = "plain_language"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
