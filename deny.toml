[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Our own crate is AGPL-3.0-or-later (the project license); allow it here
# WITHOUT permitting AGPL in third-party dependencies — the allow-list above
# stays permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-rs" },
    # The trace marker is AGPL like the rest of the toolchain. A dev-dependency
    # only, and not transitive, so this admits nothing into a consumer's graph.
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
    # The local dependency-boundary crate (PLAT-843): part of this repo, same
    # license as `quire-rs` itself.
    { allow = ["AGPL-3.0-or-later"], crate = "quire-rust-extraction" },
    # The shared tree-sitter parse layer (PLAT-843), pinned by git rev in
    # `crates/quire-rust-extraction/Cargo.toml`. Also AGPL-3.0-or-later.
    { allow = ["AGPL-3.0-or-later"], crate = "quire-code-parse" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git sources, none published to a registry. Listed explicitly so
# `unknown-git = "deny"` keeps its teeth rather than being silently widened.
# `ix-trace-rs` is the trace-marker crate; `quire-code-rs` is pinned for its
# `quire-code-parse` workspace member, the shared tree-sitter parse layer
# `crates/quire-rust-extraction` wraps (PLAT-843). Both are public repos
# (PLAT-848) but crates.io publishing is deferred deliberately — both
# entries are deletable once that lands, not an architectural exception.
# `filament-core-data` and `quoin` are pinned for PLAT-906: resolving
# `common.schema.json`, the semantic-core 0.2.0 bundle, and quoin's
# semantic-module test fixtures through their owning repositories instead of
# holding committed copies. Neither dependency's own code is called — see the
# `Cargo.toml` comments on those entries.
allow-git = [
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-code-rs",
    "https://github.com/agent-ix/filament-core-data",
    "https://github.com/agent-ix/quoin",
]
