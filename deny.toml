[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Our own crate is AGPL-3.0-or-later (the project license); allow it here
# WITHOUT permitting AGPL in third-party dependencies — the allow-list above
# stays permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-rs" },
    # The trace marker is AGPL like the rest of the toolchain. A dev-dependency
    # only, and not transitive, so this admits nothing into a consumer's graph.
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The only git source: the trace-marker crate, which is not published to a
# registry. Listed explicitly so `unknown-git = "deny"` keeps its teeth.
allow-git = ["https://github.com/agent-ix/ix-trace-rs"]
