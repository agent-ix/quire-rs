name: sanitize

# NFR-018 — ThreadSanitizer + AddressSanitizer on the rayon walk
# (tests/corpus_concurrency.rs). Manual-trigger for now.
#
# This covers the data-race / memory surface of the parallel walk. TSAN/
# ASAN of the GIL window + Python object handoff needs a sanitizer-
# instrumented CPython and is tracked separately.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize:
    name: TSAN + ASAN (rayon walk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + rust-src
        shell: bash
        run: |
          rustup toolchain install nightly-2026-08-27 --profile minimal --component rust-src
          rustup default nightly-2026-08-27
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      # PLAT-901: `build.rs` fetches its schema packages via `npm pack`;
      # `cargo test` compiles the crate, so it needs npm on PATH.
      - name: Set up Node (npm for build.rs's fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # @agent-ix/* scoped packages live on GitHub Packages (npm.ix's
      # target), not public npm. Without this, npm/npm-pack falls back to
      # registry.npmjs.org and 404s on every @agent-ix package.
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: ThreadSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=thread" cargo +nightly-2026-08-27 test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency
      - name: AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly-2026-08-27 test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency
