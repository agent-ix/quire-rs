name: sanitize

# NFR-018 — FFI sanitizer coverage is too slow for PR checks. The workflow is
# available manually and runs weekly; it does not add a push or pull-request gate.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust-corpus:
    name: Rust corpus TSAN + ASAN
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly + rust-src
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-linux-gnu
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Set up Node (npm for build.rs schema fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: ThreadSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=thread" cargo +nightly test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency
      - name: AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency

  tsan-python:
    name: Python extension TSAN
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target/sanitize-tsan
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zsanitizer=thread"
      RUSTUP_TOOLCHAIN: nightly
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-linux-gnu
      - name: Set up Node (npm for build.rs schema fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build and test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements/ci.txt
          .venv/bin/python -m pip install maturin==1.13.3
      - name: Build the Python extension with ThreadSanitizer
        run: |
          .venv/bin/maturin develop --locked --features python \
            --target x86_64-unknown-linux-gnu -Z build-std
      - name: Run concurrent Python binding harnesses under ThreadSanitizer
        run: |
          TSAN_RUNTIME="$(gcc -print-file-name=libtsan.so)"
          test -f "$TSAN_RUNTIME"
          LD_PRELOAD="$TSAN_RUNTIME" TSAN_OPTIONS="$TSAN_OPTIONS" \
            .venv/bin/python -m pytest tests/python/test_fr023_gil.py -q

  asan-python:
    name: Python extension ASAN
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target/sanitize-asan
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zsanitizer=address"
      RUSTUP_TOOLCHAIN: nightly
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly x86_64-unknown-linux-gnu
      - name: Set up Node (npm for build.rs schema fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build and test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements/ci.txt
          .venv/bin/python -m pip install maturin==1.13.3
      - name: Build the Python extension with AddressSanitizer
        run: |
          .venv/bin/maturin develop --locked --features python \
            --target x86_64-unknown-linux-gnu -Z build-std
      - name: Run focused Python object-handoff tests under AddressSanitizer
        env:
          PYTHONMALLOC: malloc
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/asan.supp:print_suppressions=1
        run: |
          ASAN_RUNTIME="$(gcc -print-file-name=libasan.so)"
          test -f "$ASAN_RUNTIME"
          LD_PRELOAD="$ASAN_RUNTIME" ASAN_OPTIONS="$ASAN_OPTIONS" \
            LSAN_OPTIONS="$LSAN_OPTIONS" .venv/bin/python -m pytest \
              tests/python/test_bindings.py \
              -k 'parse_document_returns_structured_object or extract_envelope_returns_extraction_and_edges or extract_frontmatter_returns_dict_or_none or binding_returns_materialized_values_without_python_json_reparse' \
              -q
