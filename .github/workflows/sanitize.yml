name: sanitize

# NFR-018 — ThreadSanitizer + AddressSanitizer on the rayon walk
# (tests/corpus_concurrency.rs). Manual-trigger for now.
#
# This covers the data-race / memory surface of the parallel walk. TSAN/
# ASAN of the GIL window + Python object handoff needs a sanitizer-
# instrumented CPython and is tracked separately.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize:
    name: TSAN + ASAN (rayon walk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly action
        with:
          toolchain: nightly-2026-08-27
          components: rust-src
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: ThreadSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=thread" cargo +nightly test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency
      - name: AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test --locked \
            -Z build-std --target x86_64-unknown-linux-gnu \
            --test corpus_concurrency
