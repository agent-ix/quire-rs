name: tag attestation

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      publish: false

  release-artifacts:
    name: collect release wheels
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Collect all wheel matrix outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*.whl
          if-no-files-found: error

  release-evidence:
    name: create and retain release evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the triggering tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the pinned Quoin evidence recorder
        shell: bash
        env:
          NPMJS_REGISTRY: "\u0068ttps:\u002f\u002fregistry.npmjs.org"
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/quoin-tooling" \
            --userconfig /dev/null --ignore-scripts --no-audit --no-fund \
            --registry="$NPMJS_REGISTRY" @agent-ix/quoin@0.30.1

      - name: Run SUITE-001 and record its evidence
        env:
          QUOIN: ${{ runner.temp }}/quoin-tooling/node_modules/.bin/quoin
        run: make evidence

      - name: Upload the retained evidence store
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: spec/evidence/
          if-no-files-found: error

  attest:
    needs: [release-artifacts, release-evidence]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: agent-ix/engineering-assurance/.github/workflows/release-attestation.yml@v0.9.0
    with:
      tag: ${{ github.ref_name }}
      ea_tooling_tag: v0.9.0
      quoin_tooling_tag: 0.30.1
      record_path: ${{ vars.RELEASE_RECORD_PATH }}
      allowed_signers_path: ${{ vars.ALLOWED_SIGNERS_PATH }}
      artifact_name: release-artifacts
      evidence_artifact: release-evidence
