name: tag attestation

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    secrets:
      REGISTRY_TOKEN:
        description: Read access to the Agent-IX npm packages needed to build Quire-rs.
        required: true
    inputs:
      run_wheels:
        description: Build and upload Quire-rs release wheels as part of this call.
        required: false
        type: boolean
        default: false
      release_artifact_name:
        description: Actions artifact containing the release files.
        required: false
        type: string
        default: release-artifacts
      evidence_artifact_name:
        description: Same-run Actions artifact passed to Engineering Assurance.
        required: false
        type: string
        default: release-evidence
      ea_tooling_tag:
        description: Published Engineering Assurance consumer release.
        required: false
        type: string
        default: v0.9.0
      quoin_tooling_tag:
        description: Published Quoin evidence exporter release.
        required: false
        type: string
        default: 0.36.10

permissions: {}

jobs:
  build:
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          (inputs.run_wheels ||
           (github.repository == 'agent-ix/quire-rs' &&
            github.workflow_ref == format('agent-ix/quire-rs/.github/workflows/tag-attestation.yml@{0}', github.ref))) }}
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      publish: false

  release-artifacts:
    name: collect release wheels
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          (inputs.run_wheels ||
           (github.repository == 'agent-ix/quire-rs' &&
            github.workflow_ref == format('agent-ix/quire-rs/.github/workflows/tag-attestation.yml@{0}', github.ref))) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Collect all wheel matrix outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_artifact_name || 'release-artifacts' }}
          path: dist/*.whl
          if-no-files-found: error

  release-evidence:
    name: generate and retain release evidence
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out the exact tagged source and recursive submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check out the Process validation provider
        uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-artifacts-process
          ref: c29697dd2c083e08defdec73d31efa3f41141a80
          path: .ci/spec-artifacts-process
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the ISO validation provider
        uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-artifacts-iso
          ref: f3e556c423eee451ac833eb1c0a950006c137bc6
          path: .ci/spec-artifacts-iso
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the tagged Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Set up Node for build-time schema package fetches
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Configure authenticated Agent-IX npm registry
        uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Generate and verify release evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VALIDATION_PROCESS_ROOT: ${{ github.workspace }}/.ci/spec-artifacts-process
          VALIDATION_ISO_ROOT: ${{ github.workspace }}/.ci/spec-artifacts-iso
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: make -C source evidence

      - name: Retain verified evidence for the shared attestation workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.evidence_artifact_name || 'release-evidence' }}
          path: source/target/release-evidence/verified/
          if-no-files-found: error

  attest:
    needs: [release-artifacts, release-evidence]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
          needs.release-evidence.result == 'success' &&
          (needs.release-artifacts.result == 'success' || needs.release-artifacts.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: agent-ix/engineering-assurance/.github/workflows/release-attestation.yml@v0.9.0
    with:
      tag: ${{ github.ref_name }}
      ea_tooling_tag: ${{ inputs.ea_tooling_tag || 'v0.9.0' }}
      quoin_tooling_tag: ${{ inputs.quoin_tooling_tag || '0.36.10' }}
      record_path: ${{ vars.RELEASE_RECORD_PATH }}
      allowed_signers_path: ${{ vars.ALLOWED_SIGNERS_PATH }}
      artifact_name: ${{ inputs.release_artifact_name || 'release-artifacts' }}
      evidence_artifact: ${{ inputs.evidence_artifact_name || 'release-evidence' }}
