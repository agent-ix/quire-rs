name: tag attestation

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      publish: false

  release-artifacts:
    name: collect release wheels
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Collect all wheel matrix outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*.whl
          if-no-files-found: error

  # SWM-347 FND-002 disposition: this validates content and tag binding only;
  # it does not authenticate that Terra produced the attached unsigned bundle.
  release-evidence:
    name: validate and retain attached release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out tagged evidence policy and validator as data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm annotated tag identity and creation time
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo '::error::release_tag_commit_mismatch'
            exit 1
          fi
          tag_created_at="$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$RELEASE_TAG")"
          if [[ -z "$tag_created_at" ]]; then
            echo '::error::release_tag_must_be_annotated'
            exit 1
          fi
          printf 'created_at=%s\n' "$tag_created_at" >> "$GITHUB_OUTPUT"

      - name: Wait for the Terra evidence asset on the matching release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release-evidence-source
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSET_DIR"
          found=false
          for attempt in $(seq 1 60); do
            rm -f "$RELEASE_ASSET_DIR/release-evidence.tar.gz"
            if gh release download "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --pattern release-evidence.tar.gz \
              --dir "$RELEASE_ASSET_DIR" \
              > /dev/null 2> "$RUNNER_TEMP/release-evidence-download.log"; then
              found=true
              break
            fi
            sleep 60
          done
          if [[ "$found" != true ]]; then
            cat "$RUNNER_TEMP/release-evidence-download.log" >&2
            echo '::error::release_evidence_asset_missing_or_unavailable'
            exit 1
          fi

      - name: Verify attached evidence contents against this tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          TAG_CREATED_AT: ${{ steps.tag.outputs.created_at }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/release-evidence-source
        run: |
          python3 scripts/verify_release_evidence.py \
            --archive "$RELEASE_ASSET_DIR/release-evidence.tar.gz" \
            --source-root . \
            --expected-tag "$RELEASE_TAG" \
            --expected-commit "$RELEASE_SHA" \
            --tag-created-at "$TAG_CREATED_AT" \
            --output-dir release-evidence

      - name: Retain verified evidence for the shared attestation workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error

  attest:
    needs: [release-artifacts, release-evidence]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: agent-ix/engineering-assurance/.github/workflows/release-attestation.yml@v0.9.0
    with:
      tag: ${{ github.ref_name }}
      ea_tooling_tag: v0.9.0
      quoin_tooling_tag: 0.30.1
      record_path: ${{ vars.RELEASE_RECORD_PATH }}
      allowed_signers_path: ${{ vars.ALLOWED_SIGNERS_PATH }}
      artifact_name: release-artifacts
      evidence_artifact: release-evidence
