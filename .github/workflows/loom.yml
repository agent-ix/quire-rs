name: loom

# NFR-017 — exhaustive concurrency-interleaving check of the FR-024
# data-parallel collect. Manual-trigger for now (combinatorial cost).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loom:
    name: loom (concurrency permutation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      # PLAT-901: `build.rs` fetches its schema packages via `npm pack`;
      # `cargo test` compiles the crate, so it needs npm on PATH.
      - name: Set up Node (npm for build.rs's fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # @agent-ix/* scoped packages live on GitHub Packages (npm.ix's
      # target), not public npm. Without this, npm/npm-pack falls back to
      # registry.npmjs.org and 404s on every @agent-ix package.
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - name: cargo test under loom
        run: RUSTFLAGS="--cfg loom" cargo test --locked --test concurrency
