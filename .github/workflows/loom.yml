name: loom

# NFR-017 — exhaustive concurrency-interleaving check of the FR-024
# data-parallel collect. Manual-trigger for now (combinatorial cost).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loom:
    name: loom (concurrency permutation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test under loom
        run: RUSTFLAGS="--cfg loom" cargo test --locked --test concurrency
