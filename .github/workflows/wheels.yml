name: wheels

# Build the `quire` abi3 wheel (FR-023) across the full target gamut.
# Intel-Linux and AMD-Linux are the SAME x86_64 wheel — one build serves
# both vendors (a portable x86-64 baseline runs on Zen and Intel cores).
# abi3 means one wheel per platform covers all CPython 3.9+.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple (arm64)
            runner: macos-14
            target: aarch64-apple-darwin
          - label: apple-intel (x86_64)
            runner: macos-13
            target: x86_64-apple-darwin
          - label: intel + amd / luna (linux x86_64)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: arm / graviton (linux aarch64)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `--features python` + abi3 come from [tool.maturin] in
          # pyproject.toml; manylinux container is auto-selected for linux.
          args: --release --out dist
          manylinux: auto
          sccache: true

      - name: Smoke-import the wheel (native runners only)
        if: ${{ !startsWith(matrix.target, 'aarch64-unknown-linux') }}
        run: |
          python3 -m venv .wheeltest
          .wheeltest/bin/pip install --no-index --find-links dist quire
          .wheeltest/bin/python -c "import quire; print('import ok:', quire.__name__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
