name: CI

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # #267: the controlled corpus is a submodule at `corpus/`, and
          # `tests/corpus_cases.rs` reads its cases in place. Without this the
          # suite fails at load with "the corpus submodule is not checked out".
          #
          # `agent-ix/qa-corpus` is PRIVATE, so the job's default GITHUB_TOKEN
          # cannot read it — the checkout needs a PAT with `repo` scope in
          # `secrets.CORPUS_TOKEN`. Absent that secret the submodule step fails
          # loudly, which is the right failure: a green run over a corpus that
          # was never checked out is the silent-zero this programme exists to
          # end.
          submodules: false
      - name: Require private dependency token
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
        run: test -n "$CORPUS_TOKEN" || { echo "::error::CORPUS_TOKEN must read agent-ix/qa-corpus and private Cargo dependencies"; exit 1; }
      - name: Authenticate private repositories
        run: git config --global url."https://x-access-token:${{ secrets.CORPUS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Checkout locked corpus
        run: git submodule update --init --recursive --depth 1

      # Structural validation consumes executable schema modules. Both are
      # checked out by full SHA; fetch-depth 0 retains their remote-tracking
      # refs so validate_spec.py can also prove each locked commit belongs to
      # the declared origin history rather than merely existing locally.
      - name: Checkout locked process schema provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agent-ix/spec-artifacts-process
          token: ${{ secrets.CORPUS_TOKEN }}
          ref: e6ea5151b59a55d7ce0d43f1581cbe276f750e04
          fetch-depth: 0
          path: .ci/spec-artifacts-process
      - name: Checkout locked ISO schema provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agent-ix/spec-artifacts-iso
          token: ${{ secrets.CORPUS_TOKEN }}
          ref: a60ee12d735976081849f60a38d603fb5494b015
          fetch-depth: 0
          path: .ci/spec-artifacts-iso

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
          # NFR-021-AC-2 (TC-1649): `make check-wasm` in `make ci`.
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # TC-1025/TC-1027 drive the corpus LOADER (`corpus/bounds.py`) over a
      # mutated copy — the only way to prove those gates refuse what they claim
      # to refuse rather than merely reading a corpus that already conforms.
      # That makes `python3` + PyYAML a test dependency of this crate, which it
      # was not before. PyYAML is not guaranteed on the runner image, and
      # without it both tests fail on an ImportError.
      # `actions/setup-python` first, matching this repo's `python.yml`.
      # `python3 -m pip install` against the system interpreter fails on
      # ubuntu-24.04, which is PEP-668 externally-managed — and it would fail
      # the whole Rust gate, not just these two tests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Corpus runner dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements/ci.txt
          python3 -c "import yaml"   # a partial install must fail HERE

      - name: Test
        run: cargo test --locked

      - name: Validate spec against locked schema providers
        run: >-
          python3 scripts/validate_spec.py
          --process-root .ci/spec-artifacts-process
          --iso-root .ci/spec-artifacts-iso

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

      - name: Property-classifier purity audit (FR-052-CON-1)
        run: bash scripts/check_property_purity.sh

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require private dependency token
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
        run: test -n "$CORPUS_TOKEN" || { echo "::error::CORPUS_TOKEN must read private Cargo dependencies"; exit 1; }
      - name: Authenticate private repositories
        run: git config --global url."https://x-access-token:${{ secrets.CORPUS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny@0.19.8
      - name: cargo deny check licenses
        run: cargo deny --locked check licenses

  audit:
    name: Cargo Audit (RUSTSEC)
    runs-on: ubuntu-24.04
    # Run on PR, push to main, and the daily 06:00 UTC schedule.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustsec/audit-check v1.3.2 runs `cargo install cargo-audit` without
      # `--locked`. On 2026-08-29 that resolved kstring 2.0.4, which requires
      # Rust 1.96, and broke this Rust-1.94.1 job without any repository
      # change. Install the exact prebuilt tool instead: both installer and
      # installed version are reviewable inputs.
      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Report cargo-audit identity
        run: cargo audit --version
      - name: Audit locked dependency graph
        run: cargo audit

  # Miri (UB detection) job retired — ADR 0006. First-party UB is compile-impossible
  # via `#![forbid(unsafe_code)]` (NFR-003-AC-5); dependency advisories are covered by
  # cargo-audit (NFR-014); the concurrency surface by loom (NFR-017). Miri produced a
  # Stacked-Borrows false-positive inside rayon's thread pool and is opt-in per the
  # rust-lib-cookiecutter baseline.

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    # Weekly Mon 07:00 UTC + workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require private dependency token
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
        run: test -n "$CORPUS_TOKEN" || { echo "::error::CORPUS_TOKEN must read private Cargo dependencies"; exit 1; }
      - name: Authenticate private repositories
        run: git config --global url."https://x-access-token:${{ secrets.CORPUS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: cargo mutants
        run: cargo mutants -p quire-rs --in-place --check --cargo-arg=--locked --json > mutants.json || true
      - name: Upload mutants.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report
          path: mutants.json
          if-no-files-found: warn

  perf:
    name: Perf Bench (NFR-001/002/007 baselines + regression bands)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require private dependency token
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
        run: test -n "$CORPUS_TOKEN" || { echo "::error::CORPUS_TOKEN must read private Cargo dependencies"; exit 1; }
      - name: Authenticate private repositories
        run: git config --global url."https://x-access-token:${{ secrets.CORPUS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Restore stored criterion baseline (`main`)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      # First PR ever has no baseline — `--save-baseline main` writes
      # one; subsequent runs compare against it via `--baseline main`
      # and the make perf-gate target inspects criterion's stored JSON
      # for a >10% slowdown.
      - name: Run benches against stored baseline
        run: |
          if [[ -d target/criterion/parse/demo-item/main ]]; then
            cargo bench --locked --bench parse --bench load -- --baseline main
          else
            cargo bench --locked --bench parse --bench load -- --save-baseline main
          fi
      # The canonical perf gate is the Apple Silicon baseline (10% band,
      # enforced locally / on the canonical runner). The shared Ubuntu CI
      # runner is noisy for sub-microsecond benches, so it uses the +50%
      # allowance the NFR cross-runner policy already grants the Ubuntu
      # lane (see NFR-002 "Cross-runner policy"). Catches gross
      # regressions without flaking on runner variance.
      - name: Enforce regression band (Ubuntu CI +50% per NFR cross-runner policy)
        env:
          QUIRE_PERF_BAND: "0.50"
        run: bash scripts/check_perf_regression.sh

  audit-static:
    name: Static Audits
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: check_no_net_deps
        run: bash scripts/audits/check_no_net_deps.sh
      - name: check_no_schemars
        run: bash scripts/audits/check_no_schemars.sh
      - name: check_no_shellout
        run: bash scripts/audits/check_no_shellout.sh
      - name: check_dep_pins
        run: bash scripts/audits/check_dep_pins.sh
      - name: check_hashmap_audit
        run: bash scripts/audits/check_hashmap_audit.sh
      - name: check_no_shared_mutable
        run: bash scripts/audits/check_no_shared_mutable.sh
      - name: verify_cookiecutter_inheritance
        run: bash scripts/audits/verify_cookiecutter_inheritance.sh
