name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # daily 06:00 UTC for cargo-audit
    - cron: "0 6 * * *"
    # weekly Mon 06:00 UTC for miri
    - cron: "0 6 * * 1"
    # weekly Mon 07:00 UTC for mutants
    - cron: "0 7 * * 1"

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses

  audit:
    name: Cargo Audit (RUSTSEC)
    runs-on: ubuntu-24.04
    # Run on PR, push to main, and the daily 06:00 UTC schedule.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *')
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-24.04
    # Weekly Mon 06:00 UTC + workflow_dispatch + tag push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Ensure miri component
        run: rustup component add miri --toolchain nightly
      - name: cargo miri test --lib
        env:
          # Many lib tests load fixture modules from disk (Registry::load_module
          # → std::fs::canonicalize) and use tempdirs, which Miri's default
          # filesystem isolation forbids. Disabling isolation lifts only the
          # syscall sandbox so those reads succeed; UB detection — this job's
          # actual purpose — is fully retained.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    # Weekly Mon 07:00 UTC + workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: cargo mutants
        run: cargo mutants -p quire-rs --in-place --check --json > mutants.json || true
      - name: Upload mutants.json
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.json
          if-no-files-found: warn

  perf:
    name: Perf Bench (NFR-001/002/007 baselines + regression bands)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Restore stored criterion baseline (`main`)
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      # First PR ever has no baseline — `--save-baseline main` writes
      # one; subsequent runs compare against it via `--baseline main`
      # and the make perf-gate target inspects criterion's stored JSON
      # for a >10% slowdown.
      - name: Run benches against stored baseline
        run: |
          if [[ -d target/criterion/parse/demo-item/main ]]; then
            cargo bench --bench parse --bench load -- --baseline main
          else
            cargo bench --bench parse --bench load -- --save-baseline main
          fi
      # The canonical perf gate is the Apple Silicon baseline (10% band,
      # enforced locally / on the canonical runner). The shared Ubuntu CI
      # runner is noisy for sub-microsecond benches, so it uses the +50%
      # allowance the NFR cross-runner policy already grants the Ubuntu
      # lane (see NFR-002 "Cross-runner policy"). Catches gross
      # regressions without flaking on runner variance.
      - name: Enforce regression band (Ubuntu CI +50% per NFR cross-runner policy)
        env:
          QUIRE_PERF_BAND: "0.50"
        run: bash scripts/check_perf_regression.sh

  audit-static:
    name: Static Audits
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: check_no_net_deps
        run: bash scripts/audits/check_no_net_deps.sh
      - name: check_no_schemars
        run: bash scripts/audits/check_no_schemars.sh
      - name: check_no_shellout
        run: bash scripts/audits/check_no_shellout.sh
      - name: check_dep_pins
        run: bash scripts/audits/check_dep_pins.sh
      - name: check_hashmap_audit
        run: bash scripts/audits/check_hashmap_audit.sh
      - name: verify_cookiecutter_inheritance
        run: bash scripts/audits/verify_cookiecutter_inheritance.sh
