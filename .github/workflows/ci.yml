name: CI

on:
  workflow_dispatch:
jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # #267: the controlled corpus is a submodule at `corpus/`, and
          # `tests/corpus_cases.rs` reads its cases in place. Without this the
          # suite fails at load with "the corpus submodule is not checked out".
          #
          # `agent-ix/qa-corpus` is PRIVATE, so the job's default GITHUB_TOKEN
          # cannot read it — the checkout needs a PAT with `repo` scope in
          # `secrets.CORPUS_TOKEN`. Absent that secret the submodule step fails
          # loudly, which is the right failure: a green run over a corpus that
          # was never checked out is the silent-zero this programme exists to
          # end.
          submodules: recursive
          token: ${{ secrets.CORPUS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

      - name: Property-classifier purity audit (FR-052-CON-1)
        run: bash scripts/check_property_purity.sh

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses

  audit:
    name: Cargo Audit (RUSTSEC)
    runs-on: ubuntu-24.04
    # rustsec/audit-check posts a check-run and files an issue for any
    # advisory; without these the default (restricted) GITHUB_TOKEN fails
    # with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
      issues: write
    # Run on PR, push to main, and the daily 06:00 UTC schedule.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *')
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Miri (UB detection) job retired — ADR 0006. First-party UB is compile-impossible
  # via `#![forbid(unsafe_code)]` (NFR-003-AC-5); dependency advisories are covered by
  # cargo-audit (NFR-014); the concurrency surface by loom (NFR-017). Miri produced a
  # Stacked-Borrows false-positive inside rayon's thread pool and is opt-in per the
  # rust-lib-cookiecutter baseline.

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    # Weekly Mon 07:00 UTC + workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: cargo mutants
        run: cargo mutants -p quire-rs --in-place --check --json > mutants.json || true
      - name: Upload mutants.json
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.json
          if-no-files-found: warn

  perf:
    name: Perf Bench (NFR-001/002/007 baselines + regression bands)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Restore stored criterion baseline (`main`)
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      # First PR ever has no baseline — `--save-baseline main` writes
      # one; subsequent runs compare against it via `--baseline main`
      # and the make perf-gate target inspects criterion's stored JSON
      # for a >10% slowdown.
      - name: Run benches against stored baseline
        run: |
          if [[ -d target/criterion/parse/demo-item/main ]]; then
            cargo bench --bench parse --bench load -- --baseline main
          else
            cargo bench --bench parse --bench load -- --save-baseline main
          fi
      # The canonical perf gate is the Apple Silicon baseline (10% band,
      # enforced locally / on the canonical runner). The shared Ubuntu CI
      # runner is noisy for sub-microsecond benches, so it uses the +50%
      # allowance the NFR cross-runner policy already grants the Ubuntu
      # lane (see NFR-002 "Cross-runner policy"). Catches gross
      # regressions without flaking on runner variance.
      - name: Enforce regression band (Ubuntu CI +50% per NFR cross-runner policy)
        env:
          QUIRE_PERF_BAND: "0.50"
        run: bash scripts/check_perf_regression.sh

  audit-static:
    name: Static Audits
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: check_no_net_deps
        run: bash scripts/audits/check_no_net_deps.sh
      - name: check_no_schemars
        run: bash scripts/audits/check_no_schemars.sh
      - name: check_no_shellout
        run: bash scripts/audits/check_no_shellout.sh
      - name: check_dep_pins
        run: bash scripts/audits/check_dep_pins.sh
      - name: check_hashmap_audit
        run: bash scripts/audits/check_hashmap_audit.sh
      - name: check_no_shared_mutable
        run: bash scripts/audits/check_no_shared_mutable.sh
      - name: verify_cookiecutter_inheritance
        run: bash scripts/audits/verify_cookiecutter_inheritance.sh
