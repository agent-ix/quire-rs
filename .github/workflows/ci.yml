name: Paired parser diagnostic
'on':
  workflow_dispatch:
    inputs:
      baseline_ref:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  paired:
    name: Paired parser diagnostic
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - name: Set up Node (npm for build.rs's fetch)
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - uses: agent-ix/nodejs-actions/setup-npmrc@main
      with:
        npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
    - name: Measure both revisions on one runner without the shared baseline cache
      env:
        BASELINE_REF: ${{ inputs.baseline_ref }}
        CANDIDATE_REF: ${{ inputs.candidate_ref }}
      run: 'set -euo pipefail

        lscpu | sed -n ''/Architecture:/p; /Model name:/p; /CPU MHz:/p''

        rustc --version

        base="$RUNNER_TEMP/paired-base"

        candidate="$RUNNER_TEMP/paired-candidate"

        git worktree add --detach "$base" "$BASELINE_REF"

        git worktree add --detach "$candidate" "$CANDIDATE_REF"

        export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/paired-parser"

        cd "$base"

        cargo bench --locked --bench parse -- parse/small --save-baseline paired-diagnostic

        cd "$candidate"

        cargo bench --locked --bench parse -- parse/small --baseline paired-diagnostic

        cp "$CARGO_TARGET_DIR/criterion/parse/small/change/estimates.json" "$RUNNER_TEMP/paired-candidate-change.json"

        cd "$base"

        cargo bench --locked --bench parse -- parse/small --baseline paired-diagnostic

        cp "$CARGO_TARGET_DIR/criterion/parse/small/change/estimates.json" "$RUNNER_TEMP/paired-repeat-change.json"

        cat "$RUNNER_TEMP/paired-candidate-change.json"

        cat "$RUNNER_TEMP/paired-repeat-change.json"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: paired-parser-estimates
        path: ${{ runner.temp }}/paired-*-change.json
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
