name: Fuzz

# NFR-011: weekly fuzzing of each fuzz target (5 minutes per target) +
# workflow_dispatch for on-demand runs.

on:
  workflow_dispatch:

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parse_document
          - fuzz_extract_frontmatter
          - fuzz_apply_patch
          - fuzz_extract_dsl
          - fuzz_load_manifest
          - fuzz_load_schema
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2026-08-27 --profile minimal
          rustup default nightly-2026-08-27

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # PLAT-901: `build.rs` fetches its schema packages via `npm pack`;
      # building a fuzz target compiles the crate, so it needs npm on PATH.
      - name: Set up Node (npm for build.rs's fetch)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # @agent-ix/* scoped packages live on GitHub Packages (npm.ix's
      # target), not public npm. Without this, npm/npm-pack falls back to
      # registry.npmjs.org and 404s on every @agent-ix package.
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Run fuzz target (5 minutes)
        # -max_total_time=300 caps wall-clock at 5 minutes per NFR-011.
        run: cargo +nightly-2026-08-27 fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload corpus artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
