name: Fuzz

# NFR-011: weekly fuzzing of each fuzz target (5 minutes per target) +
# workflow_dispatch for on-demand runs.

on:
  workflow_dispatch:

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parse_document
          - fuzz_extract_frontmatter
          - fuzz_apply_patch
          - fuzz_extract_dsl
          - fuzz_load_manifest
          - fuzz_load_schema
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly action
        with:
          toolchain: nightly-2026-08-27

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Run fuzz target (5 minutes)
        # -max_total_time=300 caps wall-clock at 5 minutes per NFR-011.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload corpus artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
