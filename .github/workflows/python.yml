name: python-bindings

# Build the feature-gated PyO3 wheel and run the pytest binding suite
# (FR-023 / Gate G6).
#
# This suite is the *only* verification of the PyO3-parity criteria
# (FR-042-AC-10, FR-043-AC-7, FR-047-AC-9 — TC-666, TC-673, TC-715), and plain
# `make ci` does not run it: it needs a built wheel. While nothing ran it,
# TC-715 sat asserting check ids that CR-014 had renamed and nothing caught it.
#
# Every workflow in this repo is manual-dispatch by deliberate policy, so the
# recurrence guard is local rather than a PR trigger: `make ci-python` builds
# the wheel and runs this suite, and is required before merging any change to
# `src/grammar/`, `src/python/`, or `tests/python/`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: build wheel + pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build + test deps
        run: python3 -m pip install --require-hashes -r requirements/ci.txt

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --locked --release --features python --out dist

      - name: Install the wheel
        run: python3 -m pip install --no-index --find-links dist quire

      - name: Run binding tests
        run: pytest tests/python/ -v
